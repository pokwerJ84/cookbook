<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=9">

<title>Japan Protein Cookbook</title><link rel="stylesheet" href="./app.css?v=9"></head><body><main class="app"><div id="updateBanner" class="update-banner" hidden><span data-i18n="updateAvailable">Je dostupná nová verze aplikace.</span><button id="updateApp" class="btn primary" data-i18n="updateNow">Aktualizovat</button></div><section class="hero"><h1 data-i18n="title"></h1><p data-i18n="subtitle"></p><div class="stats"><span class="pill"><b id="totalRecipes"></b> <span data-i18n="recipes"></span></span><span class="pill">🇯🇵 Japan Edition</span><span class="pill">CZ / EN / 日本語</span></div></section><div class="compact-tools"><button id="filterDrawerBtn" class="btn">☰ <span data-i18n="filters">Filtry</span></button><button id="historyBtn" class="btn">✓ <span data-i18n="cookedHistory">Vařil jsem</span></button><span id="activeFilterCount" class="pill"></span></div><div class="toolbar filter-panel" id="filterPanel"><label class="control"><input id="search"></label><label class="control"><select id="chapter"></select></label><label class="control"><select id="sort"></select></label><div class="control toggle"><span id="modeText"></span><span class="switch" id="modeSwitch"></span></div></div><div class="top-actions"><button class="btn primary" id="addRecipe" data-i18n="addRecipe"></button><button class="btn" id="random" data-i18n="random"></button><button class="btn" id="cloudBtn">☁️ Supabase</button><span class="pill" id="cloudStatus"></span><label class="control" style="min-height:43px"><select id="language"><option value="cs">Čeština</option><option value="en">English</option><option value="ja">日本語</option></select></label></div><div class="view-tabs"><button class="tab active" data-view="all" data-i18n="allRecipes"></button><button class="tab" data-view="favorites">♡ <span data-i18n="favorites"></span></button><button class="tab" data-view="custom">＋ <span data-i18n="myRecipes"></span></button></div><div class="filter-chips" id="filterChips"><button class="filter-chip active" data-filter="all" data-i18n="filterAll"></button><button class="filter-chip" data-filter="under150" data-i18n="filterUnder150"></button><button class="filter-chip" data-filter="lowcal" data-i18n="filterLow"></button><button class="filter-chip" data-filter="highprotein" data-i18n="filterHigh"></button><button class="filter-chip" data-filter="protein30" data-i18n="filterProtein30"></button><button class="filter-chip" data-filter="highfiber" data-i18n="filterFiber"></button><button class="filter-chip" data-filter="lowcarb" data-i18n="filterLowCarb"></button><button class="filter-chip" data-filter="lowfat" data-i18n="filterLowFat"></button><button class="filter-chip" data-filter="cheap" data-i18n="filterCheap"></button><button class="filter-chip" data-filter="family" data-i18n="filterFamily"></button><button class="filter-chip" data-filter="quick" data-i18n="filterQuick"></button><button class="filter-chip" data-filter="mealprep" data-i18n="filterMeal"></button></div><div class="sort-note" data-i18n="sortHint"></div><div id="content"></div></main>
<nav class="bottom-nav" aria-label="Main navigation"><button class="nav-btn active" data-nav="all"><span class="nav-icon">⌂</span><span data-i18n="home"></span></button><button class="nav-btn" data-nav="favorites"><span class="nav-icon">♡</span><span data-i18n="favorites"></span></button><button class="nav-btn add" data-nav="add"><span class="nav-icon">＋</span><span data-i18n="add"></span></button><button class="nav-btn" data-nav="shopping"><span class="nav-icon">🛒</span><span data-i18n="shoppingNav"></span></button><button class="nav-btn" data-nav="profile"><span class="nav-icon">☁</span><span data-i18n="account"></span></button></nav>
<div class="modal" id="recipeModal"><div class="sheet"><div class="sheet-head"><div><h2 id="mTitle"></h2><div class="meta" id="mMeta"></div></div><button class="btn" id="closeRecipe">×</button></div><div class="recipe-hero"><img id="mImage" class="detail-image"><button class="hero-fav" id="detailFav" aria-label="Favorite">♡</button></div><div class="image-actions"><label class="btn primary"><span data-i18n="changePhoto"></span><input type="file" id="recipePhoto" accept="image/*" hidden></label><button class="btn" id="removePhoto" data-i18n="removePhoto"></button><button class="btn" id="editCustom" data-i18n="edit" style="display:none"></button><button class="btn danger" id="deleteCustom" data-i18n="delete" style="display:none"></button></div><div class="macros" id="mMacros"></div><div class="section-box"><h3 data-i18n="ingredients"></h3><ul id="mIngredients" class="ingredient-list"></ul></div><div class="detail-quick-actions"><button class="btn" id="addAllToShopping">🛒 <span data-i18n="addToShopping">Přidat do nákupu</span></button><button class="btn" id="markCooked">✓ <span data-i18n="markCooked">Označit jako uvařené</span></button></div><button class="btn primary cook-start" id="startCooking">▶ <span data-i18n="startCooking"></span></button><div class="section-box"><h3 data-i18n="steps"></h3><ol id="mSteps"></ol></div><div class="section-box"><h3 data-i18n="where"></h3><p id="mStores"></p><h3 data-i18n="cost"></h3><p id="mCost"></p></div><div class="section-box"><h3 data-i18n="mealprep"></h3><p id="mPrep"></p><h3 data-i18n="freeze"></h3><p id="mFreeze"></p><h3 data-i18n="keep"></h3><p id="mKeep"></p></div><div class="section-box"><h3 data-i18n="familyVersion"></h3><p id="mFamily"></p></div><p class="note" data-i18n="estimate"></p><button class="btn primary" id="printRecipe" data-i18n="print"></button></div></div>
<div class="modal" id="formModal"><form class="sheet" id="recipeForm"><div class="sheet-head"><h2 id="formTitle"></h2><button type="button" class="btn" id="closeForm">×</button></div><input type="hidden" id="editId"><div class="form-grid"><div class="field full"><label data-i18n="recipeName"></label><input id="fName" required></div><div class="field"><label data-i18n="chapter"></label><select id="fChapter"></select></div><div class="field"><label data-i18n="emoji"></label><input id="fEmoji" value="🍽️"></div><div class="field"><label data-i18n="prepTime"></label><input id="fTime" value="20 min"></div><div class="field"><label data-i18n="difficultyField"></label><input id="fDiff"></div><div class="field"><label data-i18n="price"></label><input id="fCost" type="number" min="0" value="200"></div><div class="field"><label data-i18n="photo"></label><input id="fPhoto" type="file" accept="image/*"></div><div class="field full"><h3 data-i18n="nutrition"></h3></div><div class="field"><label data-i18n="kcal"></label><input id="fKcal" type="number" min="0" required></div><div class="field"><label data-i18n="proteinG"></label><input id="fP" type="number" step="0.1" min="0" required></div><div class="field"><label data-i18n="carbsG"></label><input id="fC" type="number" step="0.1" min="0" required></div><div class="field"><label data-i18n="fatG"></label><input id="fF" type="number" step="0.1" min="0" required></div><div class="field"><label data-i18n="fiberG"></label><input id="fFiber" type="number" step="0.1" min="0" value="0"></div><div class="field full"><label data-i18n="ingredients"></label><textarea id="fIngredients" required></textarea><small class="note" data-i18n="ingredientsHint"></small></div><div class="field full"><label data-i18n="steps"></label><textarea id="fSteps" required></textarea><small class="note" data-i18n="stepsHint"></small></div><div class="field full"><label data-i18n="storesHint"></label><textarea id="fStores"></textarea></div><div class="field full"><label data-i18n="prepHint"></label><textarea id="fPrep"></textarea></div><div class="field full"><label data-i18n="freezeHint"></label><textarea id="fFreeze"></textarea></div><div class="field full"><label data-i18n="keepHint"></label><textarea id="fKeep"></textarea></div><div class="field full"><label data-i18n="familyHint"></label><textarea id="fFamily"></textarea></div></div><div class="top-actions"><button class="btn primary" type="submit" data-i18n="save"></button><button class="btn" type="button" id="cancelForm" data-i18n="cancel"></button></div></form></div><div class="modal" id="authModal"><div class="sheet auth-card"><div class="sheet-head"><div><h2>☁️ <span data-i18n="accountTitle"></span></h2><p class="note" style="margin-top:-5px" data-i18n="accountDesc"></p></div><button type="button" class="btn" id="closeAuth">×</button></div><div class="auth-grid"><div class="field"><label data-i18n="email"></label><input id="authEmail" type="email" autocomplete="email" inputmode="email" placeholder="name@example.com"></div><div class="field"><label data-i18n="password"></label><input id="authPassword" type="password" autocomplete="current-password" minlength="6" data-i18n-placeholder="passwordHint"></div><div class="field" id="confirmPasswordField" style="display:none"><label data-i18n="passwordAgain"></label><input id="authPasswordConfirm" type="password" autocomplete="new-password" minlength="6"></div><div class="auth-actions"><button class="btn primary" id="signInBtn" type="button" data-i18n="signIn"></button><button class="btn" id="signUpBtn" type="button" data-i18n="signUp"></button><button class="btn" id="resendBtn" type="button" style="display:none" data-i18n="resend"></button><button class="btn" id="resetPasswordBtn" type="button" data-i18n="forgot"></button><button class="btn danger wide" id="signOutBtn" type="button" style="display:none" data-i18n="signOut"></button></div><div class="auth-state info" id="authMessage" data-i18n="authPrompt"></div></div></div></div><div class="modal" id="cookModal"><div class="sheet cook-sheet"><div class="sheet-head"><div><div class="cook-counter" id="cookCounter"></div><h2 id="cookTitle" data-i18n="cookMode"></h2></div><button class="btn" id="closeCook">×</button></div><div class="cook-progress"><span id="cookProgress"></span></div><div class="cook-step" id="cookStep"></div><div class="cook-controls"><button class="btn" id="cookPrev">← <span data-i18n="back"></span></button><button class="btn primary" id="cookNext"><span data-i18n="next"></span> →</button></div></div></div>
<div class="modal" id="shoppingModal"><div class="sheet"><div class="sheet-head"><h2 data-i18n="shoppingList">Nákupní seznam</h2><button class="btn" id="closeShopping">×</button></div><div id="shoppingListContent"></div><div class="top-actions"><button class="btn" id="clearShopping" data-i18n="clearList">Vymazat seznam</button></div></div></div>
<div class="modal" id="historyModal"><div class="sheet"><div class="sheet-head"><h2 data-i18n="cookedHistory">Vařil jsem</h2><button class="btn" id="closeHistory">×</button></div><div id="historyContent"></div></div></div>
<div class="toast" id="toast"></div>
<script defer src="./app.js?v=9"></script></body></html>
